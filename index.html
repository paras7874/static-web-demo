<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure CI/CD Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f1f5f9;
            padding: 60px 20px;
        }
        main {
            max-width: 650px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
        }
        h1 { color: #0078d4; }
        button {
            padding: 12px 20px;
            background: #0078d4;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>My Azure CI/CD Project</h1>
        <p>My website is hosted on Azure Static Web Apps.</p>
        <p id="status">Deployment status: Website loaded successfully.</p>
        <button onclick="showMessage()">Test Website</button>
    </main>

    <script>
        // Test that JavaScript is working.
        function showMessage() {
            document.getElementById("status").textContent =
                "Success! My Azure website is working.";
        }
    </script>
</body>
</html>
